<!DOCTYPE html>
<html lang="en" data-theme="light" data-platform="whatsapp" data-os="android">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ana — whatsapp</title>
<style>*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#8a8d93;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
.cg-stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;}
.cg-device{position:relative;overflow:hidden;background:#000;}
.cg-device.frame{padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.45);}
/* screenshot mode: screen fills the whole page (full-height, phone-width column) */
html,body.cg-mode-plain{height:100%;}
body.cg-mode-plain{background:#000;}
.cg-mode-plain .cg-stage{padding:0;min-height:100vh;height:100vh;display:flex;justify-content:center;}
.cg-mode-plain .cg-device{box-shadow:none;background:transparent;width:100%;max-width:480px;height:100vh;}
.cg-mode-plain .cg-screen{width:100%;height:100%;}
/* desktop web: fill the whole window, no phone-width cap */
html[data-os="web_desktop"] .cg-mode-plain .cg-device{max-width:none;}
/* generic desktop shell (sidebar + embedded conversation pane) */
.cg-desktop{display:flex;height:100%;background:#fff;color:#111;}
[data-theme="dark"] .cg-desktop{background:#1c1c1e;color:#eee;}
.cg-desk-side{width:32%;min-width:300px;max-width:400px;display:flex;flex-direction:column;background:#fff;border-right:1px solid rgba(0,0,0,.09);}
[data-theme="dark"] .cg-desk-side{background:#222225;border-right-color:rgba(255,255,255,.09);}
.cg-desk-side-head{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:12px 14px;}
.cg-desk-me{width:40px;height:40px;border-radius:50%;background:#c8ccd1;flex:0 0 auto;}
[data-theme="dark"] .cg-desk-me{background:#54585e;}
.cg-desk-search{flex:1;display:flex;align-items:center;gap:9px;background:#f0f1f3;border-radius:18px;padding:8px 13px;color:#8a8f96;font-size:14px;}
[data-theme="dark"] .cg-desk-search{background:#2c2c30;}
.cg-desk-search-ic .cg-ic{width:17px;height:17px;color:#8a8f96;}
.cg-desk-chats{flex:1 1 auto;overflow-y:auto;}
.cg-desk-chat{display:flex;align-items:center;gap:13px;padding:10px 14px;}
.cg-desk-active{background:#f0f1f3;}
[data-theme="dark"] .cg-desk-active{background:#2c2c30;}
.cg-desk-av{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:0 0 auto;}
.cg-desk-av-ph{display:flex;align-items:center;justify-content:center;background:#7b8088;color:#fff;font-weight:600;font-size:18px;}
.cg-desk-cbody{flex:1;min-width:0;}
.cg-desk-ctop{display:flex;justify-content:space-between;align-items:baseline;}
.cg-desk-cname{font-size:15.5px;font-weight:600;}
.cg-desk-ctime{font-size:12px;color:#8a8f96;}
.cg-desk-crow2{display:flex;justify-content:space-between;align-items:center;}
.cg-desk-clast{font-size:14px;color:#8a8f96;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cg-desk-badge{background:#3aa76d;color:#fff;font-size:12px;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;}
.cg-desk-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.cg-desk-main>.cg-screen-inner{flex:1;min-height:0;}
.cg-screen{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;background:#fff;}
/* ===== phone push-notification banner (opt-in `notification=`) ===== */
.cg-notif{position:absolute;left:9px;right:9px;top:56px;z-index:60;display:flex;align-items:center;gap:11px;
    padding:11px 13px;border-radius:20px;
    box-shadow:0 8px 26px rgba(0,0,0,.28);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;}
[data-os="android"] .cg-notif{top:34px;}
[data-os="web"] .cg-notif,[data-os="web_desktop"] .cg-notif{top:14px;}
.cg-notif-icon{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:0 0 auto;}
.cg-notif-main{flex:1;min-width:0;}
.cg-notif-top{display:flex;align-items:center;justify-content:space-between;line-height:1.2;}
.cg-notif-app{font-size:13px;font-weight:500;letter-spacing:0;}
.cg-notif-time{font-size:12.5px;}
.cg-notif-title{font-size:15px;font-weight:600;line-height:1.25;margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cg-notif-text{font-size:14px;line-height:1.32;margin-top:1px;
    display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;}
/* iOS banner — always the opaque light "iPhone notification" look (white-grey,
   black text), independent of chat theme, for a consistent recognizable banner */
.cg-notif-ios{background:#f2f2f6;color:#1c1c1e;}
.cg-notif-ios .cg-notif-app{color:#8a8a8e;}
.cg-notif-ios .cg-notif-time{color:#b0b0b5;}
.cg-notif-ios .cg-notif-title{color:#000;}
.cg-notif-ios .cg-notif-text{color:#1c1c1e;}
/* Android (Material) banner */
.cg-notif-android{background:#fff;color:#1f1f1f;border-radius:26px;box-shadow:0 4px 16px rgba(0,0,0,.2);}
.cg-notif-android .cg-notif-app{color:#5f6368;font-weight:500;text-transform:none;letter-spacing:0;}
.cg-notif-android .cg-notif-time{color:#5f6368;}
.cg-notif-android .cg-notif-icon{border-radius:50%;width:30px;height:30px;}
[data-theme="dark"] .cg-notif-android{background:#2d2f31;color:#e3e3e3;}
[data-theme="dark"] .cg-notif-android .cg-notif-app,[data-theme="dark"] .cg-notif-android .cg-notif-time{color:#a8abae;}
/* ===== blocked-contact bar (opt-in `blocked=`) — covers the input ===== */
.cg-blocked{position:absolute;left:0;right:0;bottom:0;z-index:55;display:flex;align-items:center;
    justify-content:center;min-height:54px;padding:15px 20px;text-align:center;font-size:15px;
    font-weight:500;background:#fafafa;color:#8a8a8e;border-top:.5px solid rgba(0,0,0,.12);}
[data-theme="dark"] .cg-blocked{background:#1c1c1e;color:#8a8a8e;border-top-color:rgba(255,255,255,.12);}
.cg-blocked-danger{color:#e0394a;font-weight:600;}
/* when animating, the banner is hidden until the script reveals it AFTER the
   messages — then it drops in from the top. Shown at rest otherwise (PNG). */
.cg-anim-armed .cg-notif:not(.cg-revealed){display:none;}
.cg-notif.cg-revealed{animation:cg-notif-in .6s cubic-bezier(.18,1.1,.32,1) both;}
@keyframes cg-notif-in{from{opacity:0;transform:translateY(-160%);}to{opacity:1;transform:none;}}
.cg-statusbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:0 19px 0 28px;height:50px;z-index:6;background:var(--cg-sb-bg,#fff);color:var(--cg-sb-fg,#000);}
.cg-sb-time{font-weight:600;font-size:16px;letter-spacing:.3px;font-variant-numeric:tabular-nums;min-width:54px;}
.cg-sb-right{display:inline-flex;align-items:center;gap:5px;}
.cg-sb-ico{display:block;}
.cg-sb-batt{display:inline-flex;align-items:center;}
.cg-sb-batt-pct{font-size:13px;font-weight:600;margin-right:1px;}
.cg-island{width:90px;height:30px;background:#000;border-radius:18px;}
.cg-home-indicator{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(0,0,0,.35);z-index:5;}
[data-theme="dark"] .cg-home-indicator{background:rgba(255,255,255,.45);}
.cg-screen-inner{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}
.cg-msg-list{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-end;scrollbar-width:none;-ms-overflow-style:none;}
/* chat-list / inbox previews are top-anchored, not bottom-anchored like a thread */
.cg-prev-list{justify-content:flex-start;}
.cg-msg-list::-webkit-scrollbar{display:none;}
.cg-date-sep{align-self:center;font-size:12px;color:#8a8a8e;margin:12px 0;font-weight:500;}
.cg-row{display:flex;margin:1px 0;align-items:flex-end;}
.cg-row.self{justify-content:flex-end;}
.cg-row.other{justify-content:flex-start;}
.cg-bubble{max-width:min(80%,460px);padding:8px 12px;border-radius:18px;font-size:16px;line-height:1.32;word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap;}
.cg-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;margin-right:8px;align-self:flex-end;flex:0 0 auto;}
.cg-img{max-width:64%;border-radius:16px;display:block;}
/* a bubble whose content is a media image must hug it — otherwise the bubble
   stretches to full row width and leaves an empty coloured tail beside the
   image (seen on Signal / VK / Viber / LINE / WeChat). The image needs an
   absolute (vw) cap, not a `%` one: percentages don't participate in the
   bubble's intrinsic (`fit-content`) sizing, so a `%`-capped image makes the
   bubble grow to the photo's full intrinsic width while the image stays narrow. */
.cg-row [class*="-bubble"]:has(> .cg-img),
.cg-row [class*="-bubble"]:has(> .cg-img-placeholder){width:-moz-fit-content;width:fit-content;}
.cg-row [class*="-bubble"]:has(> .cg-img) > .cg-img{max-width:min(64vw,300px);}
.cg-img-placeholder{width:165px;height:185px;background:linear-gradient(135deg,#c9ccd1,#aab0b7);}
[data-theme="dark"] .cg-img-placeholder{background:linear-gradient(135deg,#3a3d42,#2a2d31);}
/* reaction badge: overlaps the bottom corner of the bubble (pulled up + inset
   from the screen edge) instead of floating on its own row at the edge. */
.cg-reaction-row{display:flex;margin:-13px 13px 6px;position:relative;z-index:2;}
.cg-reaction-row.self{justify-content:flex-end;}
.cg-reaction-row.other{justify-content:flex-start;}
.cg-reactions{display:inline-flex;gap:2px;font-size:13px;line-height:1;background:#fff;
    border:1.5px solid #fff;border-radius:13px;padding:3px 7px;
    box-shadow:0 1px 2px rgba(0,0,0,.18);}
[data-theme="dark"] .cg-reactions{background:#2b2b2d;border-color:#1c1c1e;}
.cg-meta{font-size:11px;color:#8a8a8e;margin:2px 6px;}
/* a long contact/channel name in the header must truncate with an ellipsis, not
   wrap to 2-3 lines and inflate the header. A vw cap works without per-platform
   flex `min-width:0` surgery. (WhatsApp & Telegram truncate via their own rule.) */
.imsg-peer-name,.sig-name,.vk-name,.vb-name,.ig-name,.msgr-name,.tin-name,.bmb-name,
.hng-name,.line-title,.wc-title,.snap-title,.tw-name,.tw-handle,.dc-title,.sl-name{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw;}
.cg-system{align-self:center;text-align:center;font-size:12px;color:#8a8a8e;margin:8px 16px;max-width:80%;}
.cg-voice{display:inline-flex;align-items:center;gap:9px;}
.cg-voice-play{width:26px;height:26px;flex:0 0 auto;opacity:.92;}
.cg-voice-wave{display:inline-flex;align-items:center;gap:2.5px;height:26px;}
.cg-voice-wave i{width:2.5px;border-radius:2px;background:currentColor;opacity:.45;display:block;}
.cg-voice-dur{font-size:12px;opacity:.65;font-variant-numeric:tabular-nums;}
/* reply quote inside a bubble */
.cg-reply{display:block;border-left:3px solid currentColor;padding:3px 8px;margin-bottom:5px;
    border-radius:4px;background:rgba(127,127,127,.16);max-width:100%;white-space:normal;}
.cg-reply-name{display:block;font-weight:600;font-size:12.5px;line-height:1.3;}
.cg-reply-text{display:block;font-size:13px;opacity:.75;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
/* typing indicator */
.cg-typing{display:inline-flex;gap:5px;align-items:center;padding:4px 2px;}
.cg-typing i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.4;
    animation:cg-bounce 1.3s infinite ease-in-out;}
.cg-typing i:nth-child(2){animation-delay:.18s;}
.cg-typing i:nth-child(3){animation-delay:.36s;}
@keyframes cg-bounce{0%,65%,100%{opacity:.35;transform:translateY(0);}32%{opacity:.85;transform:translateY(-4px);}}
.cg-input{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;}
.cg-ic{width:24px;height:24px;display:block;flex:0 0 auto;}
/* ===== chat-list / inbox preview screen (generate_preview) ===== */
.cg-prev{height:100%;display:flex;flex-direction:column;background:#fff;color:#000;}
[data-theme="dark"] .cg-prev{background:#000;color:#fff;}
.cg-prev-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;}
.cg-prev-title{flex:1;text-align:center;font-size:17px;font-weight:600;}
.cg-prev-title-lg{flex:1;font-size:30px;font-weight:800;letter-spacing:-.5px;}
.cg-prev-back .cg-ic,.cg-prev-head-ic .cg-ic{width:26px;height:26px;color:var(--acc);}
/* colored header variant (WhatsApp/Viber/LINE/WeChat) */
.cg-prev-colored .cg-prev-head{background:var(--acc);color:#fff;}
.cg-prev-colored .cg-prev-title{font-weight:600;}
.cg-prev-colored .cg-prev-back .cg-ic,.cg-prev-colored .cg-prev-head-ic .cg-ic{color:#fff;}
.cg-prev-search{display:flex;align-items:center;gap:8px;margin:4px 14px 8px;padding:8px 12px;
    background:#ececed;border-radius:11px;color:#8a8a8e;font-size:15px;}
[data-theme="dark"] .cg-prev-search{background:#1c1c1e;}
.cg-prev-search .cg-ic{width:17px;height:17px;color:#8a8a8e;}
.cg-prev-list{padding:0;}
.cg-prev-row{display:flex;align-items:center;gap:12px;padding:9px 14px;}
.cg-prev-row.pinned{background:rgba(127,127,127,.06);}
.cg-prev-av{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:0 0 auto;}
.cg-prev-body{flex:1;min-width:0;border-bottom:.5px solid rgba(127,127,127,.18);padding-bottom:9px;}
.cg-prev-r1{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.cg-prev-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cg-prev-mute{font-size:12px;opacity:.6;}
.cg-prev-time{font-size:13px;color:#8a8a8e;flex:0 0 auto;}
.cg-prev-time.unread{color:var(--acc);}
.cg-prev-r2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;}
.cg-prev-last{font-size:14.5px;color:#8a8a8e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cg-prev-tick{color:#53bdeb;}
.cg-prev-badge{flex:0 0 auto;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;
    font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;}
.cg-prev-badge.muted{background:#b3b3b8;}
.cg-prev-pin{font-size:12px;opacity:.5;}

.wa{height:100%;display:flex;flex-direction:column;background:#efeae2;color:#111b21;}
[data-theme="dark"] .wa{background:#0b141a;color:#e9edef;}
html[data-platform="whatsapp"] .cg-statusbar{background:#008069;color:#fff;}
html[data-theme="dark"][data-platform="whatsapp"] .cg-statusbar{background:#202c33;color:#fff;}
.wa-wallpaper{background-image:radial-gradient(rgba(0,0,0,.04) 1px,transparent 1px);background-size:18px 18px;}
[data-theme="dark"] .wa-wallpaper{background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);}
.wa-header{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#008069;color:#fff;}
[data-theme="dark"] .wa-header{background:#202c33;}
.wa-back{display:flex;align-items:center;}
.wa-back .cg-ic{width:26px;height:26px;stroke-width:2.4;}
.wa-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;}
.wa-peer{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.18;}
.wa-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wa-sub{font-size:12.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wa-icons{display:flex;align-items:center;gap:20px;}
.wa-icons .cg-ic{width:21px;height:21px;}
.wa-list{padding:10px 8px;}
.wa-sep{align-self:center;background:rgba(255,255,255,.85);color:#54656f;font-size:12px;padding:4px 10px;border-radius:8px;margin:6px auto;box-shadow:0 1px 1px rgba(0,0,0,.1);}
[data-theme="dark"] .wa-sep{background:#1d282f;color:#8696a0;}
.wa-row{margin:1px 0;}
.wa-rstart{margin-top:7px;}
.wa-gava{width:28px;height:28px;border-radius:50%;object-fit:cover;align-self:flex-end;margin-right:6px;flex:0 0 auto;}
.wa-gava-sp{width:34px;flex:0 0 auto;}
.wa-sender{display:block;font-size:13px;font-weight:600;margin-bottom:2px;line-height:1.2;}
.wa-wrap{display:flex;flex-direction:column;max-width:82%;}
.cg-row.self .wa-wrap{align-items:flex-end;}
.cg-row.other .wa-wrap{align-items:flex-start;}
.wa-bubble{position:relative;max-width:100%;padding:6px 8px 6px 9px;border-radius:8px;box-shadow:0 1px .5px rgba(0,0,0,.13);font-size:15px;line-height:1.34;}
.wa-self{background:#d9fdd3;}
[data-theme="dark"] .wa-self{background:#005c4b;color:#e9edef;}
.wa-other{background:#fff;}
[data-theme="dark"] .wa-other{background:#202c33;color:#e9edef;}
/* tail on the first bubble of a run (top outer corner) */
.wa-tail.wa-self{border-top-right-radius:0;}
.wa-tail.wa-other{border-top-left-radius:0;}
.wa-tail.wa-self::before{content:"";position:absolute;top:0;right:-7px;border-style:solid;border-width:0 0 10px 8px;border-color:transparent transparent transparent #d9fdd3;}
[data-theme="dark"] .wa-tail.wa-self::before{border-left-color:#005c4b;}
.wa-tail.wa-other::before{content:"";position:absolute;top:0;left:-7px;border-style:solid;border-width:0 8px 10px 0;border-color:transparent #fff transparent transparent;}
[data-theme="dark"] .wa-tail.wa-other::before{border-right-color:#202c33;}
.wa-text{margin-right:54px;white-space:pre-wrap;overflow-wrap:anywhere;}
.wa-footer{position:absolute;right:8px;bottom:4px;font-size:11px;color:#667781;display:inline-flex;align-items:center;gap:2px;}
[data-theme="dark"] .wa-footer{color:#8696a0;}
.wa-footer-media{position:static;display:block;text-align:right;margin-top:2px;}
.wa-mediabubble{padding:3px;}
.wa-mediabubble .wa-footer-media{padding:0 5px 2px;}
.wa-bubble-wrap{display:flex;flex-direction:column;}
.cg-row.self .wa-bubble-wrap{align-items:flex-end;}
.wa-read{color:#53bdeb;}
/* native WhatsApp reply: colored left bar + tinted inset, rounded (mobile + web) */
.wa-bubble .cg-reply{border-left:4px solid #06cf9c;background:rgba(11,20,26,.05);border-radius:6px;padding:4px 9px;margin-bottom:4px;overflow:hidden;}
[data-theme="dark"] .wa-bubble .cg-reply{background:rgba(255,255,255,.06);}
.wa-bubble .cg-reply-name{color:#06cf9c;font-size:13px;}
.wa-bubble .cg-reply-text{opacity:.7;}
/* media fills the bubble (photo message), caption + time sit below */
.wa-mediabubble{padding:3px;width:240px;max-width:66%;}
.wa-mediabubble .wa-img,.wa-mediabubble .cg-img{width:100%;max-width:none;border-radius:6px;display:block;}
.wa-mediabubble .cg-img-placeholder{width:100%;height:230px;border-radius:6px;}
/* caption nested bubble: strip its bubble chrome so it reads as a caption */
.wa-mediabubble .cg-bubble{box-shadow:none;padding:4px 6px 0;background:transparent;}
.wa-input{background:transparent;gap:8px;padding:7px 10px;}
.wa-field{flex:1;display:flex;align-items:center;gap:9px;background:#fff;border-radius:22px;padding:8px 12px;color:#8696a0;font-size:16px;}
[data-theme="dark"] .wa-field{background:#202c33;color:#8696a0;}
.wa-field .cg-ic{width:23px;height:23px;color:#8a98a3;}
.wa-ph{flex:1;}
.wa-field-ic{display:flex;align-items:center;gap:14px;}
.wa-send{background:#00a884;color:#fff;width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
.wa-send .cg-ic{width:22px;height:22px;color:#fff;}

/* ===== WhatsApp Web (desktop) ===== */
.wad{display:flex;height:100%;background:#d1d7db;font-size:14.5px;}
[data-theme="dark"] .wad{background:#0b141a;}
.wad-side{width:34%;min-width:330px;max-width:440px;display:flex;flex-direction:column;background:#fff;border-right:1px solid #e9edef;}
[data-theme="dark"] .wad-side{background:#111b21;border-right-color:#222d34;}
.wad-side-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 16px;background:#f0f2f5;}
[data-theme="dark"] .wad-side-head{background:#202c33;}
.wad-me{width:40px;height:40px;border-radius:50%;background:#d9dde0;}
[data-theme="dark"] .wad-me{background:#6a7175;}
.wad-side-icons .cg-ic{width:22px;height:22px;color:#54656f;}
[data-theme="dark"] .wad-side-icons .cg-ic{color:#aebac1;}
.wad-search{display:flex;align-items:center;gap:12px;margin:8px 12px;padding:7px 12px;background:#f0f2f5;border-radius:8px;color:#667781;font-size:14px;}
[data-theme="dark"] .wad-search{background:#202c33;color:#8696a0;}
.wad-search-ic .cg-ic{width:17px;height:17px;color:#54656f;}
[data-theme="dark"] .wad-search-ic .cg-ic{color:#8696a0;}
.wad-chats{flex:1 1 auto;overflow-y:auto;}
.wad-chat{display:flex;align-items:center;gap:14px;padding:11px 14px;cursor:default;}
.wad-chat+.wad-chat,.wad-chat{border-bottom:1px solid #f0f2f5;}
[data-theme="dark"] .wad-chat{border-bottom-color:#1d282f;}
.wad-active{background:#f0f2f5;}
[data-theme="dark"] .wad-active{background:#2a3942;}
.wad-chat-av{width:49px;height:49px;border-radius:50%;object-fit:cover;flex:0 0 auto;}
.wad-chat-av-ph{display:flex;align-items:center;justify-content:center;background:#6a7175;color:#fff;font-weight:600;font-size:18px;}
.wad-chat-body{flex:1;min-width:0;}
.wad-chat-top{display:flex;justify-content:space-between;align-items:baseline;}
.wad-chat-name{font-size:16px;font-weight:500;color:#111b21;}
[data-theme="dark"] .wad-chat-name{color:#e9edef;}
.wad-chat-time{font-size:12px;color:#667781;}
[data-theme="dark"] .wad-chat-time{color:#8696a0;}
.wad-chat-row2{display:flex;justify-content:space-between;align-items:center;}
.wad-chat-last{font-size:14px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
[data-theme="dark"] .wad-chat-last{color:#8696a0;}
.wad-badge{background:#25d366;color:#fff;font-size:12px;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;}
.wad-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.wad-main-head{flex:0 0 auto;display:flex;align-items:center;gap:14px;height:60px;padding:0 18px;background:#f0f2f5;}
[data-theme="dark"] .wad-main-head{background:#202c33;}
.wad-main-av{width:40px;height:40px;border-radius:50%;object-fit:cover;}
.wad-main-peer{flex:1;display:flex;flex-direction:column;line-height:1.25;}
.wad-main-name{font-size:16px;font-weight:500;color:#111b21;}
[data-theme="dark"] .wad-main-name{color:#e9edef;}
.wad-main-sub{font-size:13px;color:#667781;}
[data-theme="dark"] .wad-main-sub{color:#8696a0;}
.wad-main-icons{display:flex;align-items:center;gap:24px;}
.wad-main-icons .cg-ic{width:22px;height:22px;color:#54656f;}
[data-theme="dark"] .wad-main-icons .cg-ic{color:#aebac1;}
.wad-msgs{flex:1 1 auto;overflow-y:auto;padding:14px 8%;background:#efeae2;}
[data-theme="dark"] .wad-msgs{background:#0b141a;}
.wad-compose{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:10px 18px;background:#f0f2f5;}
[data-theme="dark"] .wad-compose{background:#202c33;}
.wad-compose-ic .cg-ic{width:24px;height:24px;color:#54656f;}
[data-theme="dark"] .wad-compose-ic .cg-ic{color:#8696a0;}
.wad-compose-field{flex:1;background:#fff;border-radius:8px;padding:9px 14px;color:#667781;font-size:15px;}
[data-theme="dark"] .wad-compose-field{background:#2a3942;color:#8696a0;}
